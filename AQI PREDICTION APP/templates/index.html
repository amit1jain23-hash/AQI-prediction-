<!DOCTYPE html>
<html>
<head>
    <title>AQI Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="dashboard">

    <h1>🌫 Air Quality Dashboard</h1>

    <form method="POST" class="form">
        <input type="text" name="city" placeholder="Enter city" required>
        <input type="text" name="pm25" placeholder="PM2.5">
        <input type="text" name="pm10" placeholder="PM10">
        <button type="submit">Analyze</button>
    </form>

    {% if aqi_text %}
    <div class="card" style="color: {{ color }}">
    <h2>{{ aqi_text }}</h2>
    <p style="font-size: 12px;">Updated at: {{ time }}</p>
</div>
    {% endif %}

    {% if prediction %}
    <div class="card">
        <h3>{{ prediction }}</h3>
    </div>
    {% endif %}

    {% if labels %}
    <div class="card">
        <canvas id="aqiChart"></canvas>
    </div>
    {% endif %}

</div>
{% if labels %}
<script>
    const canvas = document.getElementById('aqiChart');

    if (canvas) {
        const ctx = canvas.getContext('2d');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: {{ labels | tojson | safe }},
                datasets: [{
                    label: 'Pollution Levels',
                    data: {{ values | tojson | safe }},
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }
</script>
{% endif %}
</body>
</html>
