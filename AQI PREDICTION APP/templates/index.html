<!DOCTYPE html>
<html>
<head>
    <title>AQI Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">>
</head>

<body>

<div class="dashboard">

    <h1>🌫 Air Quality Dashboard</h1>

    <form method="POST" class="form">
        <input type="text" name="city" placeholder="Enter city" required>
        <input type="text" name="pm25" placeholder="PM2.5">
        <input type="text" name="pm10" placeholder="PM10">
        <button type="submit">Analyze</button>
    </form>

    {% if aqi_text %}
    <div class="card">
        <h2>{{ aqi_text }}</h2>
    </div>
    {% endif %}

    {% if prediction %}
    <div class="card">
        <h3>{{ prediction }}</h3>
    </div>
    {% endif %}

    {% if graph %}
    <div class="card">
        <img src="{{ url_for('static', filename=graph) }}">
    </div>
    {% endif %}

</div>

</body>
</html>
